# nginx の設定の雛形。研究室に、すでに HTTPS の入口 (nginx) がある場合に、Cloudflare Tunnel の代わりに使う。
# この環境には nginx が無いので、設定の構文は、検査していない。置いたあと、sudo nginx -t で確かめること。
#
#   1. このファイルを /etc/nginx/conf.d/voice-demo.conf に置く (http の中に読み込まれる場所)
#   2. server_name、証明書のパス、中継先のポート (サーバを起動したポート。既定の例は 8000) を、環境に合わせて書き換える
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 前提: サーバ (scripts/serve.sh) は、既定のまま、127.0.0.1 だけで待ち受ける。外から直接つなげる状態にしないこと。
#
# 【重要】サーバは、接続が 127.0.0.1 から来たときだけ、CF-Connecting-IP (なければ X-Forwarded-For の先頭) を、
# 利用者の接続元の IP アドレスとして信用する (同じ接続元から、同時に 1 件しか処理しないため)。
# nginx から中継する接続も 127.0.0.1 から来るので、利用者が自分で付けた同じ名前のヘッダが、そのまま通ると、
# 接続元を偽って、この制限を避けられる。下の proxy_set_header は、必ず、値を上書きする形で書くこと
# ($proxy_add_x_forwarded_for は、利用者が付けた値を残すので、使わない)。
#
# サーバが付ける COOP / COEP / CSP などのヘッダ (site/_headers) は、そのまま通す。nginx 側で、同じヘッダを足したり、
# 消したりしないこと (Cross-Origin-Embedder-Policy が欠けると、日本語の音声合成が、シングルスレッドになる)。

# 録音を送る POST の頻度の制限 (接続元ごと、1 分に 6 回まで)。進み具合の問い合わせ (GET /api/jobs/<id>、約 0.5 秒ごと) には、かけない
limit_req_zone $binary_remote_addr zone=voice_jobs:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                                    # nginx 1.25.1 以降。それ以前は、上の listen を「listen 443 ssl http2;」にする
    server_name demo.example.org;

    ssl_certificate     /etc/ssl/certs/demo.example.org.crt;        # 研究室の証明書 (中間証明書を含むもの)
    ssl_certificate_key /etc/ssl/private/demo.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=31536000" always;   # 常に HTTPS で出すと決めてから、有効にする

    # 録音の WAV (16 kHz・モノラル・16 bit・8 秒まで、約 256 KB)。サーバの上限 (1 MiB) と同じ
    client_max_body_size 1m;

    # access_log は、既定では、接続元の IP アドレスを記録する。研究室の規定と、サイトのフッターの「プライバシー」の文面に合わせること
    # access_log off;

    # --- 中継の共通の設定 (下の location は、これを引き継ぐ。location の中に proxy_set_header を書くと、ここの設定が消えるので、書かない) ---
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;      # 上書き (追記しない)
    proxy_set_header CF-Connecting-IP  $remote_addr;      # 上書き。利用者が付けたものを捨てる
    proxy_read_timeout 120s;                              # 1 回の応答は短い (進み具合は、問い合わせて取る)。結果の取得も数秒

    # 録音を送って、ジョブを作る (POST)。作成の頻度だけを絞る
    location = /api/jobs {
        limit_req        zone=voice_jobs burst=3 nodelay;
        limit_req_status 429;
        proxy_pass       http://127.0.0.1:8000;
    }

    # サイト (静的ファイル) と、そのほかの API
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# Cloudflare の後ろに、この nginx を置く場合 (利用者 -> Cloudflare -> nginx -> サーバ):
#   接続元は、Cloudflare が付ける CF-Connecting-IP に入っている。上の 2 行の $remote_addr を、$http_cf_connecting_ip に変え、
#   nginx への接続を、Cloudflare の IP の範囲 (https://www.cloudflare.com/ips/) だけに限ること (それ以外から、このヘッダを付けて来る接続を、通さない)。
#   limit_req_zone の $binary_remote_addr も、同じ理由で、Cloudflare の IP になってしまうので、$http_cf_connecting_ip に変える。
